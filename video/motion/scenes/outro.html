<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LedgerLens · outro</title>
<style>
  :root {
    --bg: #f7f7f5; --ink: #0F3D4C; --teal: #2A7F8E; --tint: #E6F2F4;
    --amber: #E0A100; --red: #B3261E; --grey: #5F6368; --blue: #1f4fd8; --rule: #dedcd5;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
         color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .line { left: 0; right: 0; text-align: center; font-size: 120px; font-weight: 800; letter-spacing: -3.5px; line-height: 1; }
  #t1 { top: 200px; } #t2 { top: 340px; color: var(--teal); }
  .line .w { display: inline-block; white-space: pre; }

  #mark { left: 0; right: 0; top: 560px; display: flex; justify-content: center; align-items: center; gap: 28px; }
  #mark svg { width: 120px; height: 120px; overflow: visible; }
  #mark .name { font-size: 92px; font-weight: 750; letter-spacing: -2.5px; }
  #rule { left: 760px; top: 740px; width: 400px; height: 2px; background: var(--rule); transform-origin: 50% 50%; }

  #stack { left: 0; right: 0; top: 784px; display: flex; justify-content: center; gap: 22px; font-size: 32px; font-weight: 600; color: var(--grey); }
  #stack .dot { color: var(--teal); }
  #url { left: 0; right: 0; top: 860px; text-align: center; font-size: 34px; font-weight: 600; color: var(--blue);
         font-family: "SF Mono", Menlo, "Roboto Mono", Consolas, monospace; letter-spacing: -0.3px; }
</style>
</head>
<body>
<!-- ============ EDIT TEXT HERE ============ -->
<script>
const DEFAULT_DURATION = 8;             // seconds; override with ?d=<seconds> or render.mjs --d
const TEXT = {
  line1: "Humans decide.",
  line2: "AI shows its work.",
  name: "LedgerLens",
  stack: ["Gemini", "ADK", "Cloud Run", "Firestore", "Firebase"],
  url: "github.com/changhyeonnam/ghack",
};
</script>
<!-- ======================================== -->

<div class="abs line" id="t1"></div>
<div class="abs line" id="t2"></div>

<div class="abs" id="mark">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle id="lens" cx="27" cy="27" r="19" fill="#E6F2F4" stroke="#2A7F8E" stroke-width="5" transform="rotate(-90 27 27)"/>
    <line class="ll" x1="18" y1="21" x2="36" y2="21" stroke="#0F3D4C" stroke-width="3.5" stroke-linecap="round"/>
    <line class="ll" x1="18" y1="28" x2="33" y2="28" stroke="#0F3D4C" stroke-width="3.5" stroke-linecap="round"/>
    <line class="ll" x1="18" y1="35" x2="28" y2="35" stroke="#0F3D4C" stroke-width="3.5" stroke-linecap="round"/>
    <line id="handle" x1="41.5" y1="41.5" x2="56" y2="56" stroke="#0F3D4C" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <span class="name"></span>
</div>
<div class="abs" id="rule"></div>
<div class="abs" id="stack"></div>
<div class="abs" id="url"></div>

<script>
// ---------- shared timing helpers (pure functions of t) ----------
const P = new URLSearchParams(location.search);
const D = parseFloat(P.get('d')) > 0 ? parseFloat(P.get('d')) : DEFAULT_DURATION;
window.SCENE = { duration: D };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  linear: (k) => k,
  outCubic: (k) => 1 - Math.pow(1 - k, 3),
  outQuart: (k) => 1 - Math.pow(1 - k, 4),
  inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outBack: (k) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};
// cue(t, a, b): eased 0..1 progress between fractions a and b of the scene duration
const cue = (t, a, b, ease = E.outCubic) => ease(clamp((t / D - a) / (b - a)));
const $ = (s, root = document) => root.querySelector(s);
function show(el, k, dy = 28, s0 = null) {
  el.style.opacity = clamp(k);
  el.style.transform = `translateY(${(1 - k) * dy}px)` + (s0 !== null ? ` scale(${lerp(s0, 1, k)})` : '');
}


// ---------- build DOM from TEXT ----------
function words(el, text) {
  return text.split(/(?<= )/).map((w) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; el.appendChild(s); return s; });
}
const w1 = words($('#t1'), TEXT.line1), w2 = words($('#t2'), TEXT.line2);
$('#mark .name').textContent = TEXT.name;
$('#stack').innerHTML = TEXT.stack.map((x) => `<span class="it">${x}</span>`).join('<span class="dot">·</span>');
const items = [...document.querySelectorAll('#stack > span')];
$('#url').textContent = TEXT.url;
const lens = $('#lens'), LENS = 2 * Math.PI * 19;
lens.style.strokeDasharray = LENS;
const ledgerLines = [...document.querySelectorAll('.ll')];

// ---------- timeline (fractions of D; final state holds from 0.75) ----------
window.renderAt = function (t) {
  w1.forEach((w, i) => show(w, cue(t, 0.0 + i * 0.05, 0.10 + i * 0.05), 60));
  w2.forEach((w, i) => show(w, cue(t, 0.13 + i * 0.035, 0.23 + i * 0.035), 60));

  const m = cue(t, 0.33, 0.47);
  show($('#mark'), m, 30, 0.92);
  lens.style.strokeDashoffset = LENS * (1 - cue(t, 0.33, 0.48, E.inOutCubic));
  lens.style.fillOpacity = cue(t, 0.40, 0.50);
  ledgerLines.forEach((l, i) => (l.style.opacity = cue(t, 0.42 + i * 0.02, 0.48 + i * 0.02)));
  const hk = cue(t, 0.45, 0.52);
  $('#handle').setAttribute('x2', lerp(41.5, 56, hk));
  $('#handle').setAttribute('y2', lerp(41.5, 56, hk));
  $('#handle').style.opacity = hk > 0.01 ? 1 : 0;

  $('#rule').style.transform = `scaleX(${cue(t, 0.50, 0.60, E.inOutCubic)})`;
  items.forEach((it, i) => show(it, cue(t, 0.53 + i * 0.012, 0.61 + i * 0.012), 16));
  show($('#url'), cue(t, 0.62, 0.72), 16);
};

// Preview in a browser: plays on loop; ?t=<s> freezes a frame. render.mjs passes ?capture=1.
if (P.has('capture')) renderAt(0);
else if (P.has('t')) renderAt(parseFloat(P.get('t')));
else { const s0 = performance.now(); (function loop() { renderAt(((performance.now() - s0) / 1000) % (D + 1)); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
