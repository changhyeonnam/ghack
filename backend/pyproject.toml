[project]
name = "ledgerlens-backend"
version = "0.1.0"
description = "LedgerLens: evidence-linked credit memos with a challenger agent (Gemini + ADK + Cloud Run)"
requires-python = ">=3.12"
dependencies = [
  "google-adk>=2.12,<3",
  "google-genai>=2.30,<3",
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "python-multipart>=0.0.20",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "google-cloud-firestore>=2.34",
  "google-cloud-storage>=3.0",
  "pymupdf>=1.28",
  "pillow>=11",
  "imagehash>=4.3",
  "numpy>=2",
  "reportlab>=4.4",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
